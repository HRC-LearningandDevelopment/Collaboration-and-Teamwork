<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" role="img" aria-label="A leader at the center of three rings of connections: operational, developmental, and strategic"><title>A leader at the center of three rings of connections: operational, developmental, and strategic</title><style>
.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
.float{animation:float 5s ease-in-out infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.draw{stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:draw 1.4s ease forwards .4s}
