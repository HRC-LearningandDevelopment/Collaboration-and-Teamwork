<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" role="img" aria-label="A checklist with every item ticked, beside a badge marked 80 percent"><title>A checklist with every item ticked, beside a badge marked 80 percent</title><style>
.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
.float{animation:float 5s ease-in-out infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.draw{stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:draw 1.4s ease forwards .4s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.rise,.float,.pulse,.draw{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}
</style><rect width="880" height="330" rx="0" fill="#EFF4F7"/><g transform="translate(40,120) skewY(-24)"><rect width="70" height="210" rx="12" fill="#FFFFFF" opacity="0.5"/></g><g transform="translate(130,60) skewY(-24)"><rect width="70" height="270" rx="12" fill="#FFFFFF" opacity="0.35"/></g><g transform="translate(700,40) skewY(-24)"><rect width="80" height="250" rx="12" fill="#FFFFFF" opacity="0.35"/></g><g transform="translate(790,110) skewY(-24)"><rect width="70" height="230" rx="12" fill="#FFFFFF" opacity="0.5"/></g><g class="rise"><rect x="300" y="40" width="200" height="250" rx="16" fill="#FFFFFF" stroke="#DCE4E9" stroke-width="2"/><rect x="360" y="28" width="80" height="26" rx="8" fill="#101E38"/><rect x="326" y="90" width="24" height="24" rx="6" fill="#E5F6F3" stroke="#2CD1C9" stroke-width="2"/><path class="draw" style="--l:30;animation-delay:0.5s" d="M331,102 L337,108 L346,96" fill="none" stroke="#157A72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="362" y="95" width="110" height="7" rx="3.5" fill="#DCE4E9"/><rect x="362" y="106" width="70" height="5" rx="2.5" fill="#DCE4E9" opacity=".7"/><rect x="326" y="138" width="24" height="24" rx="6" fill="#E5F6F3" stroke="#2CD1C9" stroke-width="2"/><path class="draw" style="--l:30;animation-delay:0.75s" d="M331,150 L337,156 L346,144" fill="none" stroke="#157A72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="362" y="143" width="82" height="7" rx="3.5" fill="#DCE4E9"/><rect x="362" y="154" width="70" height="5" rx="2.5" fill="#DCE4E9" opacity=".7"/><rect x="326" y="186" width="24" height="24" rx="6" fill="#E5F6F3" stroke="#2CD1C9" stroke-width="2"/><path class="draw" style="--l:30;animation-delay:1.0s" d="M331,198 L337,204 L346,192" fill="none" stroke="#157A72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="362" y="191" width="110" height="7" rx="3.5" fill="#DCE4E9"/><rect x="362" y="202" width="70" height="5" rx="2.5" fill="#DCE4E9"