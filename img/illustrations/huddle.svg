<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" role="img" aria-label="A team huddles around a table, with speech bubbles showing people speaking up"><title>A team huddles around a table, with speech bubbles showing people speaking up</title><style>
.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
.float{animation:float 5s ease-in-out infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.draw{stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:draw 1.4s ease forwards .4s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.rise,.float,.pulse,.draw{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}
